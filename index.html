<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nomewang</title>
    <!-- 引入 Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 图标库 (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- 引入自定义样式 -->
    <link rel="stylesheet" href="css/style.css">
    <!-- 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900 font-sans relative">
    
    <!-- 背景装饰 -->
    <div class="fixed inset-0 z-[-1] pointer-events-none bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-50 via-slate-50 to-white"></div>

    <!-- 导航栏 -->
    <nav class="sticky-nav border-b border-slate-200/60 bg-white/80 backdrop-blur-xl">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 font-bold text-xl tracking-tight text-slate-900" id="nav-name">
                    <!-- 动态注入姓名 -->
                </div>
                <div class="hidden sm:block">
                    <div class="ml-10 flex items-baseline space-x-6">
                        <a href="#about" class="text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" data-i18n="nav_about">关于我</a>
                        <a href="#education" class="text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" data-i18n="nav_education">教育背景</a>
                        <a href="#experience" class="text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" data-i18n="nav_experience">工作经历</a>
                        <a href="#publications" class="text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" data-i18n="nav_publications">论文&专利</a>
                        <a href="#awards" class="text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" data-i18n="nav_awards">个人荣誉</a>
                    </div>
                </div>
                <!-- 语言切换按钮 -->
                <div class="flex items-center ml-4">
                    <button id="lang-toggle" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100/80 text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 border border-slate-200 transition-all text-sm font-medium">
                        <i class="fa-solid fa-globe"></i>
                        <span id="lang-label">EN</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        
        <!-- About Section (关于我) -->
        <section id="about" class="mb-24 pt-12 animate-fade-in-up">
            <div class="bg-white/60 backdrop-blur-sm rounded-3xl p-8 md:p-12 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100/60">
                <div class="flex flex-col md:flex-row items-center md:items-start gap-10">
                    <!-- 头像区域 -->
                    <div class="relative group">
                        <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-blue-500 rounded-full blur opacity-20 group-hover:opacity-40 transition duration-500"></div>
                        <div class="relative w-40 h-40 md:w-48 md:h-48 flex-shrink-0 bg-slate-100 rounded-full overflow-hidden flex items-center justify-center text-slate-400 border-4 border-white shadow-md">
                            <img id="hero-avatar" src="images/avatar.jpg" alt="Avatar" class="w-full h-full object-cover">
                        </div>
                    </div>
                    
                    <!-- 个人信息区域 -->
                    <div class="flex-1 text-center md:text-left pt-2">
                        <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight" id="hero-name">姓名</h1>
                        <p class="mt-4 text-xl text-indigo-600 font-semibold tracking-wide flex items-center justify-center md:justify-start gap-2">
                            <i class="fa-solid fa-terminal text-sm opacity-70"></i>
                            <span id="hero-title">头衔 / 职位</span>
                        </p>
                        <p class="mt-6 text-base md:text-lg text-slate-600 leading-relaxed max-w-2xl mx-auto md:mx-0 font-light" id="hero-bio">
                            个人简介内容...
                        </p>
                        
                        <!-- 社交链接容器 -->
                        <div class="mt-8 flex justify-center md:justify-start space-x-4" id="hero-social">
                            <!-- 动态注入社交链接 -->
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Education Section (教育背景) -->
        <section id="education" class="mb-24">
            <h2 class="text-2xl font-bold text-slate-900 flex items-center mb-8 pb-4 border-b border-slate-200">
                <i class="fa-solid fa-university mr-3 text-indigo-500"></i><span data-i18n="title_education">教育背景</span>
            </h2>
            
            <div class="space-y-8 pl-4 border-l-2 border-indigo-100 ml-3" id="education-list">
                <!-- 动态注入教育背景 -->
            </div>
        </section>

        <!-- Experience Section (工作经历) -->
        <section id="experience" class="mb-24">
            <h2 class="text-2xl font-bold text-slate-900 flex items-center mb-8 pb-4 border-b border-slate-200">
                <i class="fa-solid fa-briefcase mr-3 text-indigo-500"></i><span data-i18n="title_experience">工作经历</span>
            </h2>
            <!-- 单列左对齐时间轴 -->
            <div class="space-y-8 pl-4 border-l-2 border-indigo-100 ml-3 relative" id="experience-list">
                <!-- 动态注入工作经历 -->
            </div>
        </section>

        <!-- Publications & Patents Section (论文&专利) -->
        <section id="publications" class="mb-24">
            <h2 class="text-2xl font-bold text-slate-900 flex items-center mb-8 pb-4 border-b border-slate-200">
                <i class="fa-solid fa-book-open mr-3 text-indigo-500"></i><span data-i18n="title_publications">论文&专利</span>
            </h2>
            
            <div class="space-y-6" id="publications-list">
                <!-- 动态注入论文 -->
            </div>
        </section>

        <!-- Awards Section (个人荣誉) -->
        <section id="awards" class="mb-24">
            <h2 class="text-2xl font-bold text-slate-900 flex items-center mb-8 pb-4 border-b border-slate-200">
                <i class="fa-solid fa-medal mr-3 text-indigo-500"></i><span data-i18n="title_awards">个人荣誉</span>
            </h2>
            
            <!-- 横向滚动容器及其左右感应区 -->
            <div class="relative group/scroll">
                <!-- 左侧感应区 -->
                <div id="scroll-left-zone" class="absolute left-0 top-0 bottom-6 w-16 bg-gradient-to-r from-slate-50 to-transparent z-10 opacity-0 group-hover/scroll:opacity-100 transition-opacity duration-300 pointer-events-auto flex items-center justify-start pl-2 hidden md:flex">
                    <div class="w-8 h-8 rounded-full bg-white/80 shadow-md flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-white transition-all backdrop-blur-sm cursor-pointer">
                        <i class="fa-solid fa-chevron-left pointer-events-none"></i>
                    </div>
                </div>
                
                <div class="flex overflow-x-auto gap-6 pb-6 scroll-smooth hide-scrollbar cursor-grab active:cursor-grabbing relative z-0" id="awards-list">
                    <!-- 动态注入个人荣誉 -->
                </div>

                <!-- 右侧感应区 -->
                <div id="scroll-right-zone" class="absolute right-0 top-0 bottom-6 w-16 bg-gradient-to-l from-slate-50 to-transparent z-10 opacity-0 group-hover/scroll:opacity-100 transition-opacity duration-300 pointer-events-auto flex items-center justify-end pr-2 hidden md:flex">
                    <div class="w-8 h-8 rounded-full bg-white/80 shadow-md flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-white transition-all backdrop-blur-sm cursor-pointer">
                        <i class="fa-solid fa-chevron-right pointer-events-none"></i>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 py-8">
        <div class="max-w-4xl mx-auto px-4 text-center text-gray-500 text-sm">
            <p>&copy; <span id="year">2023</span> <span id="footer-name">Name</span>. All rights reserved.</p>
        </div>
    </footer>

    <!-- 引入数据和主逻辑 -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
