<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 禁止搜索引擎收录与推流 -->
    <meta name="robots" content="noindex, nofollow">
    <title>Shuai Chen | AIGC Researcher</title>
    <!-- 引入 Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 图标库 (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- 引入自定义样式 -->
    <link rel="stylesheet" href="css/style.css">
    <!-- 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900 font-sans relative">
    
    <!-- 背景装饰：柔和渐变 + 顶部细网格 -->
    <div class="fixed inset-0 z-[-2] pointer-events-none bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-50 via-slate-50 to-white"></div>
    <div class="bg-grid fixed inset-0 z-[-1] pointer-events-none"></div>

    <!-- 导航栏 -->
    <nav class="sticky-nav border-b border-slate-200/60 bg-white/80 backdrop-blur-xl">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 font-bold text-xl tracking-tight text-slate-900" id="nav-name">
                    <!-- 动态注入姓名 -->
                </div>
                <div class="hidden sm:block">
                    <div class="ml-10 flex items-baseline space-x-6">
                        <a href="#about" class="nav-link text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" data-i18n="nav_about">关于我</a>
                        <a href="#education" class="nav-link text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" data-i18n="nav_education">教育背景</a>
                        <a href="#experience" class="nav-link text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" data-i18n="nav_experience">工作经历</a>
                        <a href="#publications" class="nav-link text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" data-i18n="nav_publications">论文&专利</a>
                        <a href="#awards" class="nav-link text-slate-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors" data-i18n="nav_awards">个人荣誉</a>
                    </div>
                </div>
                <!-- 语言切换按钮 -->
                <div class="flex items-center ml-4">
                    <button id="lang-toggle" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100/80 text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 border border-slate-200 transition-all text-sm font-medium">
                        <i class="fa-solid fa-globe"></i>
                        <span id="lang-label">EN</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        
        <!-- About Section (关于我) -->
        <section id="about" class="mb-24 pt-12 animate-fade-in-up">
            <div class="bg-white/60 backdrop-blur-sm rounded-3xl p-6 md:p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100/60">
                <div class="flex flex-col md:flex-row items-center md:items-start gap-8">
                    <!-- 头像区域 -->
                    <div class="relative group flex-shrink-0">
                        <div class="avatar-ring absolute -inset-1 rounded-full opacity-70 group-hover:opacity-100 group-hover:saturate-150 group-hover:brightness-110 transition-all duration-500"></div>
                        <div class="absolute -inset-2 rounded-full bg-indigo-500/10 blur-md group-hover:bg-indigo-500/25 group-hover:-inset-3 transition-all duration-500"></div>
                        <div class="relative w-32 h-32 md:w-36 md:h-36 bg-slate-100 rounded-full overflow-hidden border-4 border-white shadow-lg group-hover:shadow-[0_18px_45px_-12px_rgba(99,102,241,0.45)] transition-shadow duration-500">
                            <img id="hero-avatar" src="images/avatar.jpg" alt="Avatar" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out">
                        </div>
                    </div>
                    
                    <!-- 个人信息区域 -->
                    <div class="flex-1 text-center md:text-left pt-2">
                        <h1 class="font-display text-3xl md:text-4xl font-bold text-slate-900 tracking-tight" id="hero-name">姓名</h1>
                        <div class="mt-3 text-center md:text-left">
                            <p class="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-indigo-50/80 border border-indigo-100/80 text-indigo-600 text-sm font-semibold tracking-wide">
                                <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                                <span id="hero-title">头衔 / 职位</span>
                            </p>
                        </div>
                        <p class="mt-4 text-sm md:text-base text-slate-600 leading-relaxed max-w-2xl mx-auto md:mx-0 font-light" id="hero-bio">
                            个人简介内容...
                        </p>
                        
                        <!-- 社交链接 + 简历下载 -->
                        <div class="mt-6 flex flex-wrap items-center justify-center md:justify-start gap-x-4 gap-y-3">
                            <div class="flex justify-center md:justify-start space-x-3" id="hero-social">
                                <!-- 动态注入社交链接 -->
                            </div>
                            <a href="cv_20260813.pdf" download class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-indigo-600 text-white text-sm font-semibold shadow-sm hover:bg-indigo-700 hover:shadow-md hover:-translate-y-0.5 transition-all duration-300">
                                <i class="fa-solid fa-file-arrow-down"></i>
                                <span data-i18n="btn_cv">下载简历</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Education Section (教育背景) -->
        <section id="education" class="mb-24 reveal">
            <header class="mb-8 flex items-end gap-4">
                <span class="font-display text-3xl md:text-4xl font-medium text-indigo-200/90 leading-none select-none" aria-hidden="true">01</span>
                <div class="pb-1.5">
                    <h2 class="font-display text-xl md:text-2xl font-bold text-slate-900 tracking-tight"><span data-i18n="title_education">教育背景</span></h2>
                    <p class="text-[0.6rem] font-semibold tracking-[0.3em] uppercase text-slate-400 mt-1">Education</p>
                </div>
                <div class="flex-1 h-px bg-gradient-to-r from-slate-300/80 via-slate-200/50 to-transparent mb-4"></div>
            </header>
            
            <div class="space-y-8 pl-4 border-l-2 border-indigo-100 ml-3" id="education-list">
                <!-- 动态注入教育背景 -->
            </div>
        </section>

        <!-- Experience Section (工作经历) -->
        <section id="experience" class="mb-24 reveal">
            <header class="mb-8 flex items-end gap-4">
                <span class="font-display text-3xl md:text-4xl font-medium text-indigo-200/90 leading-none select-none" aria-hidden="true">02</span>
                <div class="pb-1.5">
                    <h2 class="font-display text-xl md:text-2xl font-bold text-slate-900 tracking-tight"><span data-i18n="title_experience">工作经历</span></h2>
                    <p class="text-[0.6rem] font-semibold tracking-[0.3em] uppercase text-slate-400 mt-1">Experience</p>
                </div>
                <div class="flex-1 h-px bg-gradient-to-r from-slate-300/80 via-slate-200/50 to-transparent mb-4"></div>
            </header>
            <!-- 单列左对齐时间轴 -->
            <div class="space-y-8 pl-4 border-l-2 border-indigo-100 ml-3 relative" id="experience-list">
                <!-- 动态注入工作经历 -->
            </div>
        </section>

        <!-- Publications & Patents Section (论文&专利) -->
        <section id="publications" class="mb-24 reveal">
            <header class="mb-8 flex items-end gap-4">
                <span class="font-display text-3xl md:text-4xl font-medium text-indigo-200/90 leading-none select-none" aria-hidden="true">03</span>
                <div class="pb-1.5">
                    <h2 class="font-display text-xl md:text-2xl font-bold text-slate-900 tracking-tight"><span data-i18n="title_publications">论文&专利</span></h2>
                    <p class="text-[0.6rem] font-semibold tracking-[0.3em] uppercase text-slate-400 mt-1">Publications</p>
                </div>
                <div class="flex-1 h-px bg-gradient-to-r from-slate-300/80 via-slate-200/50 to-transparent mb-4"></div>
            </header>
            
            <div class="space-y-6" id="publications-list">
                <!-- 动态注入论文 -->
            </div>
        </section>

        <!-- Awards Section (个人荣誉) -->
        <section id="awards" class="mb-24 reveal">
            <header class="mb-8 flex items-end gap-4">
                <span class="font-display text-3xl md:text-4xl font-medium text-indigo-200/90 leading-none select-none" aria-hidden="true">04</span>
                <div class="pb-1.5">
                    <h2 class="font-display text-xl md:text-2xl font-bold text-slate-900 tracking-tight"><span data-i18n="title_awards">个人荣誉</span></h2>
                    <p class="text-[0.6rem] font-semibold tracking-[0.3em] uppercase text-slate-400 mt-1">Honors & Awards</p>
                </div>
                <div class="flex-1 h-px bg-gradient-to-r from-slate-300/80 via-slate-200/50 to-transparent mb-4"></div>
            </header>
            
            <!-- 横向滚动容器及其左右感应区 -->
            <div class="relative group/scroll">
                <!-- 左侧感应区 -->
                <div id="scroll-left-zone" class="absolute left-0 top-0 bottom-6 w-16 bg-gradient-to-r from-slate-50 to-transparent z-10 opacity-0 group-hover/scroll:opacity-100 transition-opacity duration-300 pointer-events-auto flex items-center justify-start pl-2 hidden md:flex">
                    <div class="w-8 h-8 rounded-full bg-white/80 shadow-md flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-white transition-all backdrop-blur-sm cursor-pointer">
                        <i class="fa-solid fa-chevron-left pointer-events-none"></i>
                    </div>
                </div>
                
                <div class="flex overflow-x-auto gap-6 pb-6 scroll-smooth hide-scrollbar cursor-grab active:cursor-grabbing relative z-0" id="awards-list">
                    <!-- 动态注入个人荣誉 -->
                </div>

                <!-- 右侧感应区 -->
                <div id="scroll-right-zone" class="absolute right-0 top-0 bottom-6 w-16 bg-gradient-to-l from-slate-50 to-transparent z-10 opacity-0 group-hover/scroll:opacity-100 transition-opacity duration-300 pointer-events-auto flex items-center justify-end pr-2 hidden md:flex">
                    <div class="w-8 h-8 rounded-full bg-white/80 shadow-md flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-white transition-all backdrop-blur-sm cursor-pointer">
                        <i class="fa-solid fa-chevron-right pointer-events-none"></i>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- 页脚 -->
    <footer class="border-t border-slate-200/70 bg-white/60 backdrop-blur-sm py-10">
        <div class="max-w-6xl mx-auto px-4 flex flex-col items-center gap-5">
            <div class="flex items-center space-x-2" id="footer-social">
                <!-- 动态注入社交链接 -->
            </div>
            <div class="w-20 h-px bg-gradient-to-r from-transparent via-slate-300 to-transparent"></div>
            <p class="text-sm text-slate-400">&copy; <span id="year">2026</span> <span id="footer-name">Name</span>. All rights reserved.</p>
        </div>
    </footer>

    <!-- 引入数据和主逻辑 -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
